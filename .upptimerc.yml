# === Trumpow Upptime Configuration ===
owner: mamafunny
repo: trumpow-status

sites:
  - name: Trumpow Website
    url: https://trumpow.meme

  - name: Trumpow Docs
    url: https://docs.trumpow.meme

  - name: Electrum API
    url: https://electrum-api.trumpow.meme

  - name: Electrum Server 2
    url: https://electrum-server2.trumpow.meme

  - name: TRMP Space
    url: https://trmpspace.trumpow.meme

  - name: Web Wallet
    url: https://webwallet.trumpow.meme

  - name: Explorer
    url: https://explorer.trumpow.meme

  - name: API
    url: https://api.trumpow.meme

  - name: Extension
    url: https://extension.trumpow.meme

  - name: electrum-server2.trumpow.meme (WebSocket)
    url: electrum-server2.trumpow.meme
    port: 50004
    check: "tcp-ping"

  - name: electrum-server2.trumpow.meme (SSL)
    url: electrum-server2.trumpow.meme
    port: 50002
    check: "tcp-ping"

status-website:
  cname: status.trumpow.meme
  logoUrl: https://trumpow.meme/logo.svg
  name: Trumpow Status
  introTitle: "Trumpow Network Status"
  introMessage: >
    Real-time uptime for the Trumpow website, docs, explorer, API,
    web wallet, extension, TRMP Space, and electrum servers —
    fully automated by Upptime and GitHub Actions.

  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/mamafunny/trumpow-status

  css: |
    /* === Trumpow Theme === */
    :root {
      --nav-current-border-bottom-color: #B22234;
      --submit-button-background-color: #B22234;
      --submit-button-border-color: #8B1A28;
      --submit-button-color: #ffffff;
      --body-background-color: #ffffff;
      --body-text-color: #111111;
      --card-background-color: #fafafa;
      --nav-background-color: #ffffff;
      --nav-border-bottom-color: #B22234;
      --card-border-color: #e5e5e5;
      --up-border-left-color: #28a745;
      --tag-up-background-color: #28a745;
      --graph-filter: hue-rotate(330deg) saturate(1.4) brightness(0.85);
    }

    /* Force nav red border and red links */
    header { border-bottom: 3px solid #B22234 !important; }
    header a, nav a { color: #B22234 !important; }
    header a:hover, nav a:hover { color: #8B1A28 !important; }

    /* Red accent on service cards */
    article { box-shadow: 0 1px 4px rgba(178,34,52,0.08); }

    /* Dark theme */
    @media (prefers-color-scheme: dark) {
      :root {
        --body-background-color: #111111;
        --body-text-color: #f5f5f5;
        --card-background-color: #1c1c1c;
        --nav-background-color: #161616;
        --card-border-color: #333333;
        --graph-filter: hue-rotate(330deg) saturate(1.4) brightness(1.1);
      }
      header { border-bottom-color: #FFD700 !important; }
      header a, nav a { color: #FFD700 !important; }
    }
